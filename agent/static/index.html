<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Viewer Agent</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #9aa7b8;
      --accent: #3d8bfd;
      --user: #243447;
      --bot: #1e2a3a;
      --border: #2a3648;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1.1rem; }
    header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.85rem; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      max-width: 820px;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.45;
      border: 1px solid var(--border);
    }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.bot { align-self: flex-start; background: var(--bot); }
    .msg .meta { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.35rem; }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    input[type="text"] {
      flex: 1;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    button {
      padding: 0.85rem 1.25rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .tools {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Test Viewer Agent</h1>
    <p>GCP / Kubernetes / Grafana — salt okunur analiz (Vertex AI Gemini)</p>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Örn: application-pool'daki pod'ları özetle" autocomplete="off" />
    <button type="submit" id="send">Gönder</button>
  </form>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const history = [];

    function addMsg(role, text, tools) {
      const el = document.createElement('div');
      el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = role === 'user' ? 'Siz' : 'Agent';
      el.appendChild(meta);
      const body = document.createElement('div');
      body.textContent = text;
      el.appendChild(body);
      if (tools && tools.length) {
        const t = document.createElement('div');
        t.className = 'tools';
        t.textContent = 'Araçlar: ' + tools.map(x => x.name).join(', ');
        el.appendChild(t);
      }
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMsg('user', message);
      history.push({ role: 'user', content: message });
      input.value = '';
      send.disabled = true;
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history }),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        addMsg('bot', data.reply, data.tool_calls);
        history.push({ role: 'assistant', content: data.reply });
      } catch (err) {
        addMsg('bot', 'Hata: ' + err.message);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
